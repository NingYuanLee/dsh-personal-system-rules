name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # npm trusted publishing (OIDC): short-lived, workflow-scoped publish credentials.
  # Without an NPM_TOKEN secret the publish step authenticates via OIDC instead.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci --ignore-scripts
      - name: Verify tag matches package version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION" >&2
            exit 1
          fi
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: git diff --exit-code -- client.js
      - name: Pack the installable tarball
        run: npm pack
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          FLAGS=()
          case "$VERSION" in *-*) FLAGS+=(--prerelease) ;; esac
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "dsh-personal-system-rules $GITHUB_REF_NAME" \
              --generate-notes \
              "${FLAGS[@]}"
          gh release upload "$GITHUB_REF_NAME" "dsh-personal-system-rules-$VERSION.tgz" --clobber
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "Publishing with the NPM_TOKEN secret."
          elif [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "Publishing with npm trusted publishing (OIDC)."
          else
            echo "No NPM_TOKEN secret and no OIDC id-token available; skipping npm publish."
            exit 0
          fi
          npm publish

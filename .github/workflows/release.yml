name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # npm trusted publishing (OIDC): npm issues short-lived, workflow-scoped publish
  # credentials from this permission, so no npm token secret is needed.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci --ignore-scripts
      - name: Verify tag matches package version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION" >&2
            exit 1
          fi
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: git diff --exit-code -- client.js
      - name: Pack the installable tarball
        run: npm pack
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          FLAGS=()
          case "$VERSION" in *-*) FLAGS+=(--prerelease) ;; esac
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "dsh-personal-system-rules $GITHUB_REF_NAME" \
              --generate-notes \
              "${FLAGS[@]}"
          gh release upload "$GITHUB_REF_NAME" "dsh-personal-system-rules-$VERSION.tgz" --clobber
      - name: Publish to npm (trusted publishing, OIDC)
        # npm trusted publishing: npm exchanges the workflow's OIDC id-token for
        # short-lived publish credentials, so no npm token is stored anywhere.
        # Requires a trusted publisher on npmjs.com -> Packages ->
        # dsh-personal-system-rules -> Settings -> Trusted publishing:
        #   Organization/user : NingYuanLee
        #   Repository        : dsh-personal-system-rules
        #   Workflow filename : release.yml
        #   Environment name  : (leave empty)
        run: npm publish
